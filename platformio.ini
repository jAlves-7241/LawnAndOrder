[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_echo = no
monitor_filters = direct
board_build.filesystem = littlefs
build_unflags = 
	-std=gnu++11
	-std=gnu++14
build_flags = 
	-std=gnu++17
	-Wall
	-Wextra
	-DCORE_DEBUG_LEVEL=0
	-D LANG_UI_PT
	-D LANG_SERIAL_EN
lib_ldf_mode = deep
lib_deps = 
	adafruit/RTClib @ 2.1.4
	adafruit/Adafruit BusIO @ 1.17.4
test_ignore = *

[env:native]
platform = native
test_framework = unity
test_ignore = test_soak
build_unflags =
	-std=gnu++11
	-std=gnu++14
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-pipe
	-Uunix
	-Ulinux
	-D UNIT_TEST
	-D LANG_UI_PT
	-D LANG_SERIAL_EN
	-I test/mocks
	-I src

[env:native_soak]
extends = env:native
test_ignore =
test_filter = test_soak
build_flags =
	${env:native.build_flags}
	-O2

[platformio]
default_envs = esp32dev
description = Controlador de Rega ESP32
