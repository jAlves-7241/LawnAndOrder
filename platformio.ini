[env:esp32dev]
platform = espressif32 @ ~8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_echo = no
monitor_filters = direct
board_build.filesystem = littlefs
build_unflags = 
	-std=gnu++11
	-std=gnu++14
build_flags = 
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=0
	-D LANG_UI_PT
	-D LANG_SERIAL_EN
lib_ldf_mode = deep
lib_deps = 
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit BusIO@^1.17.4
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_unflags =
	-std=gnu++11
	-std=gnu++14
build_flags =
	-std=gnu++17
	-pipe
	-Uunix
	-Ulinux
	-D UNIT_TEST
	-D LANG_UI_PT
	-D LANG_SERIAL_EN
	-I test/mocks
	-I src

[platformio]
default_envs = esp32dev
description = Controlador de Rega ESP32
