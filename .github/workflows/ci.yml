name: CI

on:
  push:
    branches:
      - main
      - master
      - test-suite
      - 'migration/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test-native:
    name: Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Run unit tests (default configuration)
        run: pio test -e native

      - name: Run unit tests (EN UI + PT Serial + LOG_LEVEL=LVL_NONE)
        env:
          PLATFORMIO_BUILD_FLAGS: "-ULANG_UI_PT -DLANG_UI_EN -ULANG_SERIAL_EN -DLANG_SERIAL_PT -DLOG_LEVEL=LVL_NONE -DMENU_WRAP_AROUND=0"
        run: pio test -e native

      - name: Run timezone-sensitive tests (TIMEZONE_OFFSET=+1)
        env:
          PLATFORMIO_BUILD_FLAGS: "-DTIMEZONE_OFFSET=1"
        run: pio test -e native -f test_rtclock -f test_terminal -f test_ui

      - name: Run soak & wraparound tests (only if unit tests pass)
        run: pio test -e native_soak

  build-esp32:
    name: ESP32 Firmware Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO platforms and packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-esp32-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-esp32-

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build firmware (alternate flags / EN UI + PT Serial + Debug)
        env:
          PLATFORMIO_BUILD_FLAGS: "-ULANG_UI_PT -DLANG_UI_EN -ULANG_SERIAL_EN -DLANG_SERIAL_PT -DLOG_LEVEL=LVL_DEBUG -DMENU_WRAP_AROUND=0"
        run: pio run -e esp32dev

      - name: Build firmware (LOG_LEVEL=LVL_NONE)
        env:
          PLATFORMIO_BUILD_FLAGS: "-DLOG_LEVEL=LVL_NONE"
        run: pio run -e esp32dev

      - name: Build firmware (default release configuration)
        run: pio run -e esp32dev
