name: CI

on:
  push:
    branches:
      - main
      - master
      - test-suite
      - 'migration/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test-native:
    name: Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Cache PlatformIO Core and packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Run unit tests
        run: pio test -e native

  build-esp32:
    name: ESP32 Firmware Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Cache PlatformIO Core and platforms
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-esp32-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-esp32-

      - name: Build firmware
        run: pio run -e esp32dev
