name: CI

on:
  push:
    branches:
      - main
      - master
      - test-suite
      - 'migration/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test-native:
    name: Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run unit tests
        run: pio test -e native

  build-esp32:
    name: ESP32 Firmware Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO platforms and packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-esp32-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-esp32-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (alternate flags / EN UI + PT Serial + Debug)
        env:
          PLATFORMIO_BUILD_FLAGS: "-ULANG_UI_PT -DLANG_UI_EN -ULANG_SERIAL_EN -DLANG_SERIAL_PT -DLOG_LEVEL=LVL_DEBUG -DMENU_WRAP_AROUND=0"
        run: pio run -e esp32dev

      - name: Build firmware (default release configuration)
        run: pio run -e esp32dev
